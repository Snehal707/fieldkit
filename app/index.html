<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FieldKit">
  <title>FieldKit</title>
  <!-- manifest.json: Hermes' public plugin-asset route serves .json; use-credentials also covers the legacy
       authenticated address -->
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
  <!-- The public asset route sends no CSP header, so the policy travels with the page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.hf.co https://cdn-lfs.hf.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com blob: data:; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <div id="app"><p style="padding:1rem;font-family:system-ui">Loading FieldKit…</p></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
