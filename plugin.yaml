name: fieldkit
version: "0.3.1"
description: "FieldKit: create and edit offline observation forms through Hermes conversations, collect entries with photos, voice notes, GPS and signatures on a phone with no internet (installable PWA, optional offline OCR and translation), sync securely when back online, and give your Hermes agent the synced entries and files to work with."
author: "FieldKit contributors"
license: MIT
homepage: "https://github.com/Snehal707/fieldkit"
requires_hermes: ">=0.23.0"
tags:
  - offline
  - mobile
  - forms
  - field-work
  - pwa
provides_tools:
  - fieldkit_list_records
  - fieldkit_get_record
  - fieldkit_get_attachment
  - fieldkit_get_sync_status
  - fieldkit_resolve_conflict
  - fieldkit_get_app_link
  - fieldkit_workspace_format
  - fieldkit_draft_workspace
  - fieldkit_publish_workspace
  - fieldkit_undo_workspace_update
  - fieldkit_get_workspace
  - fieldkit_list_workspaces
python_dependencies:
  - "jsonschema>=4.17,<5"
config_keys:
  - public_url
